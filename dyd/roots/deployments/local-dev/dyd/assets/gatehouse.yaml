api_version: v1
database:
  kind: sqlite
  path: /var/lib/gatehouse/gatehouse.db
agent_providers:
  - alias: openai
    revision: 1
    protocol: openai-responses
    base_url: https://api.openai.com/v1
    api_key:
      sources:
        - env:OPENAI_API_KEY
agent_models:
  - alias: openai-luna-low
    revision: 1
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: low
  - alias: openai-luna-medium
    revision: 1
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: medium
workspaces:
  - alias: development
    name: Development
    agents:
      - model: openai-luna-low
        label: GPT 5.6 Luna Low
        priority: 1
        max_turns: 127
        max_input_tokens: 120000
        max_output_tokens: 16000
        summary_tokens: 8000
      - model: openai-luna-medium
        label: GPT 5.6 Luna Med
        priority: 1
        max_turns: 127
        max_input_tokens: 120000
        max_output_tokens: 16000
        summary_tokens: 8000
    groups:
      - alias: members
        name: Members
        members:
          - principal: root
services:
  http:
    listen: 0.0.0.0:4283
    web:
      enabled: true
    api:
      enabled: true
