api_version: v1
database:
  kind: sqlite
  path: /var/lib/gatehouse/gatehouse.db
agent_providers:
  - alias: openai
    revision: 1
    protocol: openai-responses
    base_url: https://api.openai.com/v1
    api_key:
      sources:
        - env:OPENAI_API_KEY
agent_models:
  - alias: openai-luna-low
    revision: 6
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: low
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 98304
    max_turns: 1024
    max_output_tokens: 16000
  - alias: openai-luna-medium
    revision: 6
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: medium
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 98304
    max_turns: 1024
    max_output_tokens: 16000
  - alias: openai-luna-high
    revision: 6
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: high
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 98304
    max_turns: 1024
    max_output_tokens: 16000
workspaces:
  - alias: development
    name: Development
    agents:
      - alias: luna-high
        model: openai-luna-high
        revision: 1
        label: GPT 5.6 Luna High
      - alias: luna-medium
        model: openai-luna-medium
        revision: 1
        label: GPT 5.6 Luna Med
      - alias: luna-low
        model: openai-luna-low
        revision: 1
        label: GPT 5.6 Luna Low
        default: true
    groups:
      - alias: admins
        name: Admins
        members:
          - principal: root
    grants:
      - role: manager
        group: admins
services:
  http:
    listen: 0.0.0.0:4283
    web:
      enabled: true
    api:
      enabled: true
