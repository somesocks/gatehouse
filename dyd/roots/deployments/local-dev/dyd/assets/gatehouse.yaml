api_version: v1
database:
  kind: ephemeral
agent_providers:
  - id: openai
    revision: 1
    protocol: openai-responses
    base_url: https://api.openai.com/v1
    api_key:
      sources:
        - env:OPENAI_API_KEY
agent_models:
  - id: openai-chat
    revision: 1
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: low
workspaces:
  - id: development
    name: Development
    agents:
      - model: openai-chat
        priority: 1
    groups:
      - id: members
        name: Members
        members:
          - principal: root
services:
  http:
    listen: 0.0.0.0:4283
    web:
      enabled: true
    api:
      enabled: true
