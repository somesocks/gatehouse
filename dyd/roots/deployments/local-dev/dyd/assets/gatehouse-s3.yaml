api_version: v1
database:
  kind: sqlite
  path: /var/lib/gatehouse/gatehouse.db
agent_providers:
  - alias: openai
    revision: 1
    protocol: openai-responses
    base_url: https://api.openai.com/v1
    api_key:
      sources:
        - env:OPENAI_API_KEY
agent_models:
  - alias: openai-luna-low
    revision: 4
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: low
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 24576
    max_turns: 127
    max_output_tokens: 16000
  - alias: openai-luna-medium
    revision: 4
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: medium
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 24576
    max_turns: 127
    max_output_tokens: 16000
storage_providers:
  - alias: local-s3
    revision: 1
    protocol: s3
    endpoint: http://seaweedfs:8333
    region: us-east-1
    bucket: gatehouse
    credentials:
      access_key_id: local-development-s3
      secret_access_key:
        sources:
          - env:LOCAL_DEV_S3_SECRET_ACCESS_KEY
workspaces:
  - alias: development
    name: Development
    agents:
      - model: openai-luna-low
        label: GPT 5.6 Luna Low
        priority: 1
      - model: openai-luna-medium
        label: GPT 5.6 Luna Med
        priority: 1
    storage_providers:
      - provider: local-s3
        priority: 1
    groups:
      - alias: admins
        name: Admins
        members:
          - principal: root
    role_bindings:
      - role: manager
        group: admins
services:
  http:
    listen: 0.0.0.0:4283
    web:
      enabled: true
    api:
      enabled: true
