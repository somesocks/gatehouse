api_version: v1
database:
  kind: postgres
  url: env:GATEHOUSE_DATABASE_URL
agent_providers:
  - alias: openai
    revision: 1
    protocol: openai-responses
    base_url: https://api.openai.com/v1
    api_key:
      sources:
        - env:OPENAI_API_KEY
agent_models:
  - alias: openai-luna-low
    revision: 6
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: low
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 98304
    max_turns: 1024
    max_output_tokens: 16000
  - alias: openai-luna-medium
    revision: 6
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: medium
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 98304
    max_turns: 1024
    max_output_tokens: 16000
  - alias: openai-luna-high
    revision: 6
    provider: openai
    model: gpt-5.6-luna
    parameters:
      reasoning_effort: high
    compaction:
      algorithm: mcmtr
      history_bytes: 196608
      buffer_bytes: 98304
    max_turns: 1024
    max_output_tokens: 16000
storage_providers:
  - alias: local-s3
    revision: 1
    protocol: s3
    endpoint: http://seaweedfs:8333
    region: us-east-1
    bucket: gatehouse
    credentials:
      access_key_id: env:LOCAL_DEV_S3_ACCESS_KEY_ID
      secret_access_key:
        sources:
          - env:LOCAL_DEV_S3_SECRET_ACCESS_KEY
workspaces:
  - alias: development
    name: Development
    agents:
      - alias: luna-high
        model: openai-luna-high
        revision: 1
        label: GPT 5.6 Luna High
      - alias: luna-high-rate-limit-test
        model: openai-luna-high
        revision: 2
        label: GPT 5.6 Luna High Rate-Limit Test
        rate_limits:
          workspace_output:
            minimum_balance: -1000000000
            maximum_balance: 8000
            refill_per_minute: 96000
      - alias: luna-high-input-rate-limit-test
        model: openai-luna-high
        revision: 2
        label: GPT 5.6 Luna High Input Rate-Limit Test
        rate_limits:
          workspace_input:
            minimum_balance: -1000000000
            maximum_balance: 1
            refill_per_minute: 60000
      - alias: luna-medium
        model: openai-luna-medium
        revision: 1
        label: GPT 5.6 Luna Med
      - alias: luna-low
        model: openai-luna-low
        revision: 1
        label: GPT 5.6 Luna Low
        default: true
    storage_providers:
      - provider: local-s3
        revision: 1
        priority: 1
    groups:
      - alias: admins
        name: Admins
        members:
          - principal: root
    grants:
      - role: manager
        group: admins
services:
  http:
    listen: 0.0.0.0:4283
    public_base_url: http://localhost:4283
    web:
      enabled: true
    api:
      enabled: true
