services:
  gatehouse:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEHOUSE_DATABASE_URL: postgres://gatehouse:local-development-postgres@postgres:5432/gatehouse?sslmode=disable

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: gatehouse
      POSTGRES_PASSWORD: local-development-postgres
      POSTGRES_USER: gatehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --dbname=gatehouse --username=gatehouse"]
      interval: 2s
      timeout: 2s
      retries: 15
