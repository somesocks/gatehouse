api_version: v1
principals:
  - alias: alice
    name: Alice
    identities:
      - alias: alice-matrix
        key: "matrix:@alice:example.org"
        verifiers:
          - kind: matrix
      - alias: alice-gatehouse
        key: gatehouse:alice
        verifiers:
          - kind: argon2id
            password_verifier: env:GATEHOUSE_ALICE_PASSWORD_VERIFIER
        enabled: false
